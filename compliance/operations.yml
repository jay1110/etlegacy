lastReviewed: 2026-09-24

projectOperation:
  operatorId: project-operator
  operatorType: private-individual
  country: Germany
  publicIdentityStoredInRepository: false
  commercialOperation: false
  advertising: false
  paidAccess: false
  mandatoryDonations: false
  legalContactDetails: pending-private-record

legalNoticeReview:
  status: review
  notes:
    - The project is operated independently from the upstream ET Legacy website
    - The upstream website's presentation does not determine this deployment's obligations
    - Whether DDG and media-law provider information is required must be assessed for this concrete service
    - Personal address data must not be committed merely to complete the engineering inventory

privacyReview:
  status: review
  controller: project-operator
  jurisdiction: Germany-and-European-Union
  publicPrivacyNotice: pending
  retentionPolicy:
    status: review
    configuredRotation:
      manager: Plesk
      condition: 10240KB per log
      maximumRotatedFiles: 10
      compression: true
      emailProcessedLogs: false
    observations:
      - Plesk keeps ten compressed processed generations of HTTP and HTTPS access logs
      - Size-based rotation means low-traffic logs can remain for an unbounded calendar period
      - Proxy error-log archives observed as far back as November 2025
      - Other error-log archives observed as far back as January 2023
      - /etc/logrotate.d/nginx covers only /var/log/nginx/*.log and does not explain Plesk vhost retention
    requiredAction: Replace size-only retention with an explicit proportionate maximum time period
  processorsAndInfrastructureProviders:
    - name: Kimsufi / OVHcloud
      role: Server hosting and network infrastructure
      contractAndDpaReview: pending
      serverAddress: 135.125.189.21
      hostingControlPanel: Plesk-style vhost layout observed; exact product pending
    - name: Google public STUN
      role: WebRTC public-address discovery when the repository default is used
      actualProductionUse: pending-runtime-verification
  dataSubjectContact: pending-private-record

runtimeProcesses:
  processManager: PM2
  operatingSystemUser: root
  privilegeReview: migrate network services to an unprivileged dedicated user
  pm2LogRotation:
    moduleDetected: false
    configuredRetention: none-detected
    observedDirectorySize: 6.1MB
    requiredAction: configure bounded rotation and retention
  websocketRelay:
    pm2Application: relay
    pm2Id: 1
    script: /home/tools/ws-relay/relay.js
    workingDirectory: /home/tools/ws-relay
    arguments: none
    stdoutLog: /root/.pm2/logs/relay-out.log
    stderrLog: /root/.pm2/logs/relay-error.log
    observedLogSize: 6.1MB
    logRetention: none-detected
  p2pLobby:
    pm2Application: lobby
    pm2Id: 0
    script: /home/tools/p2p-lobby/lobby.js
    workingDirectory: /home/tools/p2p-lobby
    arguments: none
    stdoutLog: /root/.pm2/logs/lobby-out.log
    stderrLog: /root/.pm2/logs/lobby-error.log
    observedLogSize: 650B
    iceServer: stun:stun.l.google.com:19302
    turnConfigured: false
    fallbackRelay: built-in WebSocket binary relay
    logRetention: none-detected
