notIncludedInCurrentWebBuild:
  # These source trees remain relevant to native builds, but the Emscripten
  # configuration explicitly disables the corresponding features.
  - id: freetype
    source: libs/freetype
    reason: FEATURE_FREETYPE=OFF
  - id: glew
    source: libs/glew
    reason: BUNDLED_GLEW=OFF; gl4es supplies the web renderer interface
  - id: lua
    source: libs/lua
    reason: FEATURE_LUA=OFF and BUNDLED_LUA=OFF
  - id: ogg-vorbis
    source:
      - libs/ogg
      - libs/vorbis
    reason: FEATURE_OGG_VORBIS=OFF
  - id: openal
    source: libs/openal
    reason: FEATURE_OPENAL=OFF
  - id: sqlite3
    source: libs/sqlite3
    reason: FEATURE_DBMS=OFF
  - id: theora
    source: libs/theora
    reason: FEATURE_THEORA=OFF
