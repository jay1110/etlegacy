schemaVersion: 1
lastReviewed: 2026-09-24

sourceRepositories:
  - id: etlegacy-web-fork
    url: https://github.com/jay1110/etlegacy
    purpose: Source and GitHub Actions builds for the WebAssembly client
  - id: etlegacy-upstream
    url: https://github.com/etlegacy/etlegacy
    purpose: Upstream engine and Legacy mod source

webDeployments:
  - id: github-pages
    url: https://jay1110.github.io/etlegacy/
    operator: project-operator
    reviewStatus: review
  - id: etclan
    url: https://etclan.de/etl/
    operator: project-operator
    accessLog: /var/www/vhosts/system/etclan.de/logs/proxy_access_ssl_log
    errorLog: /var/www/vhosts/system/etclan.de/logs/proxy_error_log
    httpAccessLog: /var/www/vhosts/system/etclan.de/logs/proxy_access_log
    reviewStatus: review
  - id: clan-etc
    url: https://et.clan-etc.de/etl/
    operator: project-operator
    accessLog: /var/www/vhosts/system/et.clan-etc.de/logs/proxy_access_ssl_log
    errorLog: /var/www/vhosts/system/et.clan-etc.de/logs/proxy_error_log
    httpAccessLog: /var/www/vhosts/system/et.clan-etc.de/logs/proxy_access_log
    reviewStatus: review

networkServices:
  - id: websocket-udp-relay
    endpoint: wss://et.clan-etc.de/ws-relay/<host>:<port>
    reverseProxyUpstream: ws://127.0.0.1:8080/<host>:<port>
    resolvedAddress: 135.125.189.21
    implementation: tools/ws-relay
    inheritedNginxAccessLog: true
    dataReview: pending
    logRetention: pending
    reviewStatus: review
  - id: p2p-lobby
    endpoint: wss://et.clan-etc.de/p2p-lobby/
    reverseProxyUpstream: ws://127.0.0.1:8081/
    resolvedAddress: 135.125.189.21
    implementation: tools/p2p-lobby
    inheritedNginxAccessLog: true
    defaultIceServer: stun:stun.l.google.com:19302
    productionIceOverride: pending-runtime-verification
    productionTurnServer: pending-runtime-verification
    dataReview: pending
    logRetention: pending
    reviewStatus: review
  - id: public-server-list
    endpoint: https://etclan.de/serverlist.php
    implementation: external deployment
    dataReview: pending
    reviewStatus: review

downloadTrees:
  - path: etmain/
    contents: Original game data and downloaded maps
    reviewStatus: review
  - path: legacy/
    contents: Legacy mod, WASM side modules and Omni-bot
    reviewStatus: review
  - path: etjump/
    contents: ETJump data and WASM side modules
    reviewStatus: review
  - path: etpub/
    contents: ETPub data and WASM side modules
    reviewStatus: review
  - path: jaymod/
    contents: Jaymod data and WASM side modules
    reviewStatus: review
  - path: xmod/
    contents: XMod data and WASM side modules
    reviewStatus: review
  - path: nq/
    contents: No Quarter data and WASM side modules
    reviewStatus: review
  - path: etbloat/
    contents: ETBloat data and WASM side modules
    reviewStatus: review
  - path: nitmod/
    contents: Nitmod data and WASM side modules
    reviewStatus: unknown
